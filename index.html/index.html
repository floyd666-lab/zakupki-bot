<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Заявка на закупку</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f7);
    --text: var(--tg-theme-text-color, #111827);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --link: var(--tg-theme-link-color, #2481cc);
    --danger: var(--tg-theme-destructive-text-color, #e5484d);
    --card: var(--tg-theme-section-bg-color, var(--bg));
    --sep: rgba(127,127,127,.18);
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg2); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: 96px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px; }

  /* Шапка */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 14px; }
  .top h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .lang { display: flex; background: var(--card); border-radius: 10px; padding: 3px; }
  .lang button { border: 0; background: transparent; color: var(--hint); font-weight: 600; font-size: 13px;
    padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .lang button.on { background: var(--accent); color: var(--accent-text); }

  /* Шаги */
  .steps { display: flex; gap: 6px; margin-bottom: 6px; }
  .steps i { flex: 1; height: 4px; border-radius: 4px; background: var(--sep); transition: background .25s; }
  .steps i.on { background: var(--accent); }
  .step-label { font-size: 13px; color: var(--hint); margin-bottom: 14px; }

  .page { display: none; animation: fade .2s ease; }
  .page.on { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .card-title { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-bottom: 10px; }
  .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 18px;
    background: color-mix(in srgb, var(--accent) 14%, transparent); flex: none; }
  label.f { display: block; font-size: 13px; color: var(--hint); margin: 10px 0 6px; }
  label.f:first-child { margin-top: 0; }
  input, textarea, select { width: 100%; font: inherit; color: var(--text); background: var(--bg2);
    border: 1.5px solid transparent; border-radius: 12px; padding: 12px; outline: none; transition: border-color .15s; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 76px; }
  input.err, textarea.err { border-color: var(--danger); }
  .errmsg { color: var(--danger); font-size: 13px; margin-top: 6px; display: none; }
  .errmsg.on { display: block; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 0; background: var(--bg2); color: var(--text); padding: 7px 12px; border-radius: 999px;
    font-size: 14px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip:active { transform: scale(.97); }
  .recent-label { font-size: 12px; color: var(--hint); margin-top: 10px; }

  /* Позиции */
  .item { background: var(--bg2); border-radius: 12px; padding: 12px; margin-bottom: 10px; position: relative; }
  .item-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .num { font-size: 13px; font-weight: 700; color: var(--accent); }
  .del { border: 0; background: transparent; color: var(--danger); font-size: 14px; cursor: pointer; padding: 4px 6px; }
  .item input, .item select { background: var(--card); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .qty { display: flex; align-items: center; background: var(--card); border-radius: 12px; border: 1.5px solid transparent; }
  .qty:focus-within { border-color: var(--accent); }
  .qty button { border: 0; background: transparent; color: var(--accent); font-size: 22px; width: 40px; height: 44px; cursor: pointer; flex: none; }
  .qty input { border: 0; text-align: center; padding: 12px 0; background: transparent; min-width: 0; }
  .qty input:focus { border: 0; }
  .add { width: 100%; border: 1.5px dashed var(--accent); background: transparent; color: var(--accent);
    font: inherit; font-weight: 600; padding: 12px; border-radius: 12px; cursor: pointer; }

  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg button { border: 1.5px solid var(--sep); background: var(--bg2); color: var(--text); font: inherit; font-size: 14px;
    padding: 10px 4px; border-radius: 12px; cursor: pointer; }
  .seg button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); font-weight: 600; }

  /* Проверка */
  .sum-row { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--sep); }
  .sum-row:last-child { border-bottom: 0; }
  .sum-row .k { color: var(--hint); font-size: 13px; width: 96px; flex: none; }
  .sum-row .v { font-weight: 500; word-break: break-word; }
  .sum-items { margin: 0; padding-left: 20px; }
  .sum-items li { padding: 3px 0; }
  .sum-items .note { color: var(--hint); font-size: 13px; }
  .edit { border: 0; background: transparent; color: var(--link); font-size: 14px; cursor: pointer; padding: 0; margin-left: auto; }
  .hint { color: var(--hint); font-size: 13px; text-align: center; margin: 6px 0 0; }

  /* Нижние кнопки (если нет MainButton Telegram) */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--sep);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; }
  .bar button { flex: 1; border: 0; border-radius: 12px; padding: 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .bar .back { flex: 0 0 auto; background: var(--bg2); color: var(--text); padding: 14px 18px; }
  .bar .next { background: var(--accent); color: var(--accent-text); }
  .bar.hidden { display: none; }
  body.tg { padding-bottom: 24px; }

  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: rgba(0,0,0,.82); color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; max-width: 90%; text-align: center; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 data-t="title">Заявка на закупку</h1>
    <div class="lang">
      <button data-lang="ru">RU</button>
      <button data-lang="uz">UZ</button>
    </div>
  </div>

  <div class="steps"><i></i><i></i><i></i></div>
  <div class="step-label" id="stepLabel"></div>

  <!-- ШАГ 1 -->
  <section class="page" data-page="0">
    <div class="card">
      <div class="card-title"><span class="ico">🏗</span><span data-t="object">Объект</span></div>
      <input id="object" maxlength="120" autocomplete="off" data-ph="objectPh">
      <div class="errmsg" id="objectErr" data-t="required">Заполните поле</div>
      <div id="objectRecentWrap" style="display:none">
        <div class="recent-label" data-t="recent">Недавние</div>
        <div class="chips" id="objectRecent"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span class="ico">⚙️</span><span data-t="product">Изделие</span></div>
      <input id="product" maxlength="120" autocomplete="off" data-ph="productPh">
      <div class="errmsg" id="productErr" data-t="required">Заполните поле</div>
      <div id="productRecentWrap" style="display:none">
        <div class="recent-label" data-t="recent">Недавние</div>
        <div class="chips" id="productRecent"></div>
      </div>
    </div>
  </section>

  <!-- ШАГ 2 -->
  <section class="page" data-page="1">
    <div class="card">
      <div class="card-title"><span class="ico">📦</span><span data-t="items">Комплектующие</span></div>
      <div id="items"></div>
      <button class="add" id="addItem">＋ <span data-t="addItem">Добавить позицию</span></button>
    </div>
  </section>

  <!-- ШАГ 3 -->
  <section class="page" data-page="2">
    <div class="card">
      <div class="card-title"><span class="ico">⏱</span><span data-t="urgency">Срочность</span></div>
      <div class="seg" id="urgency">
        <button data-u="0" data-t="u0">Обычная</button>
        <button data-u="1" data-t="u1">🟠 Срочно</button>
        <button data-u="2" data-t="u2">🔴 Очень срочно</button>
      </div>
      <label class="f" data-t="needBy">Нужно к дате (необязательно)</label>
      <input type="date" id="needBy">
      <label class="f" data-t="comment">Комментарий (необязательно)</label>
      <textarea id="comment" maxlength="500" data-ph="commentPh"></textarea>
    </div>

    <div class="card">
      <div class="card-title"><span class="ico">✅</span><span data-t="check">Проверьте заявку</span></div>
      <div id="summary"></div>
    </div>
    <p class="hint" data-t="afterSend">После отправки заявка попадёт в отдел закупок, а бот сообщит вам об изменении статуса.</p>
  </section>
</div>

<div class="bar" id="bar">
  <button class="back" id="backBtn">←</button>
  <button class="next" id="nextBtn">Далее</button>
</div>
<div class="toast" id="toast"></div>

<script>
const T = {
  ru: {
    title: "Заявка на закупку", object: "Объект", product: "Изделие", items: "Комплектующие",
    objectPh: "Например: ЖК «Навруз», блок 3", productPh: "Например: Щит управления ЩУ-1",
    required: "Заполните поле", recent: "Недавние",
    addItem: "Добавить позицию", itemName: "Наименование", itemNamePh: "Например: Автомат ABB 16А",
    qty: "Количество", unit: "Ед. изм.", note: "Примечание / артикул (необязательно)", del: "Удалить",
    pos: "Позиция", urgency: "Срочность", u0: "Обычная", u1: "🟠 Срочно", u2: "🔴 Очень срочно",
    needBy: "Нужно к дате (необязательно)", comment: "Комментарий (необязательно)",
    commentPh: "Дополнительная информация для отдела закупок",
    check: "Проверьте заявку", edit: "Изменить", notSet: "—",
    afterSend: "После отправки заявка попадёт в отдел закупок, а бот сообщит вам об изменении статуса.",
    s0: "Шаг 1 из 3 · Объект и изделие", s1: "Шаг 2 из 3 · Что нужно закупить", s2: "Шаг 3 из 3 · Проверка и отправка",
    next: "Далее", send: "Отправить заявку", needItem: "Добавьте хотя бы одну позицию",
    fillItems: "Заполните наименование и количество", tooLong: "Заявка слишком большая — сократите примечания или разделите на две",
    sent: "Заявка отправлена", openFromBot: "Откройте форму через кнопку «📝 Новая заявка» в боте",
    units: ["шт", "м", "м²", "кг", "л", "компл", "упак", "рулон"]
  },
  uz: {
    title: "Xarid uchun ariza", object: "Obyekt", product: "Mahsulot", items: "Butlovchi qismlar",
    objectPh: "Masalan: «Navro‘z» TJM, 3-blok", productPh: "Masalan: Boshqaruv shiti ShU-1",
    required: "Maydonni to‘ldiring", recent: "Oxirgilar",
    addItem: "Pozitsiya qo‘shish", itemName: "Nomi", itemNamePh: "Masalan: ABB avtomati 16A",
    qty: "Miqdori", unit: "O‘lchov birligi", note: "Izoh / artikul (ixtiyoriy)", del: "O‘chirish",
    pos: "Pozitsiya", urgency: "Shoshilinchlik", u0: "Oddiy", u1: "🟠 Shoshilinch", u2: "🔴 Juda shoshilinch",
    needBy: "Qaysi sanagacha kerak (ixtiyoriy)", comment: "Izoh (ixtiyoriy)",
    commentPh: "Xarid bo‘limi uchun qo‘shimcha ma’lumot",
    check: "Arizani tekshiring", edit: "O‘zgartirish", notSet: "—",
    afterSend: "Yuborilgandan so‘ng ariza xarid bo‘limiga tushadi, holati o‘zgarsa bot sizga xabar beradi.",
    s0: "1-qadam / 3 · Obyekt va mahsulot", s1: "2-qadam / 3 · Nima xarid qilish kerak", s2: "3-qadam / 3 · Tekshirish va yuborish",
    next: "Keyingi", send: "Arizani yuborish", needItem: "Kamida bitta pozitsiya qo‘shing",
    fillItems: "Nomi va miqdorini to‘ldiring", tooLong: "Ariza juda katta — izohlarni qisqartiring yoki ikkiga bo‘ling",
    sent: "Ariza yuborildi", openFromBot: "Formani botdagi «📝 Yangi ariza» tugmasi orqali oching",
    units: ["dona", "m", "m²", "kg", "l", "kompl", "qadoq", "rulon"]
  }
};
// Единицы хранятся по индексу, в канал уходят на русском
const UNITS_RU = T.ru.units;

const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);
const params = new URLSearchParams(location.search);

let lang = (params.get("lang") || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || "ru").startsWith("uz") ? "uz" : "ru";
let step = 0;
let state = { object: "", product: "", items: [], urgency: 0, needBy: "", comment: "" };

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const t = k => T[lang][k];

/* ---------- Хранилище (недавние значения и черновик) ---------- */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function pushRecent(key, value) {
  value = value.trim(); if (!value) return;
  let list = (store.get(key) || []).filter(x => x.toLowerCase() !== value.toLowerCase());
  list.unshift(value); store.set(key, list.slice(0, 6));
}
function renderRecent(field) {
  const list = store.get("recent_" + field) || [];
  const wrap = $("#" + field + "RecentWrap"), box = $("#" + field + "Recent");
  wrap.style.display = list.length ? "" : "none";
  box.innerHTML = "";
  list.forEach(v => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = v;
    b.onclick = () => { $("#" + field).value = v; state[field] = v; clearErr(field); haptic("select"); saveDraft(); };
    box.appendChild(b);
  });
}
function saveDraft() { store.set("draft", state); }

/* ---------- Утилиты ---------- */
function haptic(kind) {
  if (!inTG || !tg.HapticFeedback) return;
  if (kind === "select") tg.HapticFeedback.selectionChanged();
  else if (kind === "error") tg.HapticFeedback.notificationOccurred("error");
  else if (kind === "ok") tg.HapticFeedback.notificationOccurred("success");
  else tg.HapticFeedback.impactOccurred("light");
}
let toastTimer;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 2400);
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function setErr(id, on) { $("#" + id).classList.toggle("err", on); const m = $("#" + id + "Err"); if (m) m.classList.toggle("on", on); }
function clearErr(id) { setErr(id, false); }
function fmtDate(iso) { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${d}.${m}.${y}`; }

/* ---------- Язык ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  $$("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  $$("[data-ph]").forEach(el => { el.placeholder = t(el.dataset.ph); });
  $$(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  renderItems(); renderSummary(); updateNav();
}
$$(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set("lang", lang); haptic("select"); applyLang(); });

/* ---------- Позиции ---------- */
function newItem() { return { name: "", qty: 1, unit: 0, note: "" }; }
function renderItems() {
  const box = $("#items"); box.innerHTML = "";
  state.items.forEach((it, i) => {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `
      <div class="item-head">
        <span class="num">${t("pos")} ${i + 1}</span>
        ${state.items.length > 1 ? `<button class="del" data-del="${i}">✕ ${t("del")}</button>` : ""}
      </div>
      <input data-k="name" data-i="${i}" maxlength="100" placeholder="${esc(t("itemNamePh"))}" value="${esc(it.name)}">
      <div class="row">
        <div>
          <label class="f">${t("qty")}</label>
          <div class="qty">
            <button data-step="-1" data-i="${i}">−</button>
            <input data-k="qty" data-i="${i}" inputmode="decimal" value="${esc(it.qty)}">
            <button data-step="1" data-i="${i}">+</button>
          </div>
        </div>
        <div>
          <label class="f">${t("unit")}</label>
          <select data-k="unit" data-i="${i}">
            ${t("units").map((u, ui) => `<option value="${ui}" ${ui == it.unit ? "selected" : ""}>${u}</option>`).join("")}
          </select>
        </div>
      </div>
      <label class="f">${t("note")}</label>
      <input data-k="note" data-i="${i}" maxlength="100" value="${esc(it.note)}">`;
    box.appendChild(el);
  });
}
$("#items").addEventListener("input", e => {
  const k = e.target.dataset.k, i = e.target.dataset.i; if (k == null) return;
  state.items[i][k] = k === "unit" ? +e.target.value : e.target.value;
  e.target.classList.remove("err"); saveDraft();
});
$("#items").addEventListener("change", e => {
  if (e.target.dataset.k === "unit") { state.items[e.target.dataset.i].unit = +e.target.value; saveDraft(); }
});
$("#items").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.del != null) { state.items.splice(+b.dataset.del, 1); haptic(); renderItems(); saveDraft(); return; }
  if (b.dataset.step) {
    const it = state.items[b.dataset.i];
    let q = parseFloat(String(it.qty).replace(",", ".")) || 0;
    q = Math.max(1, Math.round((q + +b.dataset.step) * 100) / 100);
    it.qty = q; haptic("select");
    b.parentElement.querySelector("input").value = q; saveDraft();
  }
});
$("#addItem").onclick = () => {
  state.items.push(newItem()); haptic(); renderItems(); saveDraft();
  const inputs = $$('#items input[data-k="name"]'); inputs[inputs.length - 1].focus();
};

/* ---------- Поля шага 1 и 3 ---------- */
["object", "product"].forEach(f => $("#" + f).addEventListener("input", e => { state[f] = e.target.value; clearErr(f); saveDraft(); }));
$("#comment").addEventListener("input", e => { state.comment = e.target.value; saveDraft(); });
$("#needBy").addEventListener("change", e => { state.needBy = e.target.value; renderSummary(); saveDraft(); });
$("#urgency").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.urgency = +b.dataset.u; haptic("select"); renderUrgency(); renderSummary(); saveDraft();
});
function renderUrgency() { $$("#urgency button").forEach(b => b.classList.toggle("on", +b.dataset.u === state.urgency)); }

/* ---------- Сводка ---------- */
function renderSummary() {
  const items = state.items.filter(i => i.name.trim());
  $("#summary").innerHTML = `
    <div class="sum-row"><span class="k">🏗 ${t("object")}</span><span class="v">${esc(state.object) || t("notSet")}</span>
      <button class="edit" data-go="0">${t("edit")}</button></div>
    <div class="sum-row"><span class="k">⚙️ ${t("product")}</span><span class="v">${esc(state.product) || t("notSet")}</span></div>
    <div class="sum-row" style="display:block">
      <div style="display:flex"><span class="k">📦 ${t("items")}: ${items.length}</span>
      <button class="edit" data-go="1">${t("edit")}</button></div>
      <ol class="sum-items">${items.map(i => `<li>${esc(i.name)} — <b>${esc(i.qty)} ${t("units")[i.unit]}</b>${i.note.trim() ? `<div class="note">${esc(i.note)}</div>` : ""}</li>`).join("")}</ol>
    </div>
    <div class="sum-row"><span class="k">⏱ ${t("urgency")}</span><span class="v">${t("u" + state.urgency)}${state.needBy ? " · " + fmtDate(state.needBy) : ""}</span></div>`;
}
$("#summary").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(+b.dataset.go); });

/* ---------- Навигация ---------- */
function validate(s) {
  if (s === 0) {
    let ok = true;
    ["object", "product"].forEach(f => { const bad = !state[f].trim(); setErr(f, bad); if (bad) ok = false; });
    if (!ok) { haptic("error"); }
    return ok;
  }
  if (s === 1) {
    // пустые строки без названия игнорируем, но если есть название — нужно количество
    let ok = true, any = false;
    state.items.forEach((it, i) => {
      const q = parseFloat(String(it.qty).replace(",", "."));
      const nameEl = $(`#items input[data-k="name"][data-i="${i}"]`);
      const qtyEl = $(`#items input[data-k="qty"][data-i="${i}"]`);
      if (it.name.trim()) {
        any = true;
        if (!(q > 0)) { ok = false; qtyEl && qtyEl.classList.add("err"); }
      } else if (state.items.length === 1 || it.note.trim()) {
        ok = false; nameEl && nameEl.classList.add("err");
      }
    });
    if (!any) { haptic("error"); toast(t("needItem")); return false; }
    if (!ok) { haptic("error"); toast(t("fillItems")); }
    return ok;
  }
  return true;
}
function go(n) {
  step = n;
  $$(".page").forEach(p => p.classList.toggle("on", +p.dataset.page === step));
  $$(".steps i").forEach((el, i) => el.classList.toggle("on", i <= step));
  if (step === 2) renderSummary();
  updateNav();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function updateNav() {
  $("#stepLabel").textContent = t("s" + step);
  const label = step === 2 ? t("send") : t("next");
  $("#nextBtn").textContent = label;
  $("#backBtn").style.display = step === 0 ? "none" : "";
  if (inTG) {
    tg.MainButton.setText(label);
    tg.MainButton.show();
    step === 0 ? tg.BackButton.hide() : tg.BackButton.show();
  }
}
function next() {
  if (!validate(step)) return;
  if (step < 2) { haptic(); go(step + 1); } else submit();
}
function back() { if (step > 0) { haptic(); go(step - 1); } }
$("#nextBtn").onclick = next;
$("#backBtn").onclick = back;

/* ---------- Отправка ---------- */
function submit() {
  const items = state.items
    .filter(i => i.name.trim())
    .map(i => [i.name.trim(), String(i.qty).replace(",", "."), UNITS_RU[i.unit], i.note.trim()]);
  const payload = {
    v: 1, l: lang,
    o: state.object.trim(), p: state.product.trim(),
    it: items, u: state.urgency, d: state.needBy, c: state.comment.trim()
  };
  const data = JSON.stringify(payload);
  if (new Blob([data]).size > 4096) { haptic("error"); toast(t("tooLong")); return; }

  pushRecent("recent_object", state.object);
  pushRecent("recent_product", state.product);
  store.set("draft", null);

  if (inTG) {
    haptic("ok");
    tg.sendData(data); // Telegram закроет окно и передаст данные боту
  } else {
    console.log("Payload:", payload);
    toast(t("openFromBot"));
  }
}

/* ---------- Старт ---------- */
(function init() {
  const savedLang = store.get("lang");
  if (savedLang && !params.get("lang")) lang = savedLang;

  const draft = store.get("draft");
  if (draft && draft.items) state = Object.assign(state, draft);
  if (!state.items.length) state.items.push(newItem());

  $("#object").value = state.object;
  $("#product").value = state.product;
  $("#comment").value = state.comment;
  $("#needBy").value = state.needBy;
  const today = new Date(); $("#needBy").min = today.toISOString().slice(0, 10);

  renderRecent("object"); renderRecent("product"); renderUrgency();

  if (inTG) {
    document.body.classList.add("tg");
    $("#bar").classList.add("hidden");
    tg.ready(); tg.expand();
    try { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); } catch (e) {}
    if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
    tg.MainButton.onClick(next);
    tg.BackButton.onClick(back);
  }
  applyLang();
  go(0);
})();
</script>
</body>
</html>
